[package]
name = "planet-hoppers"
version = "0.1.0"
edition = "2021"
default-run = "planet-hoppers"

[dependencies]
raylib = "=5.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "planet-hoppers"
path = "src/main.rs"

[[bin]]
name = "southpark"
path = "src/bin/southpark.rs"

[[bin]]
name = "solarsystem"
path = "src/bin/solarsystem.rs"

[profile.dev]
opt-level = 1
